[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# ---------------------------------------------------------------------------------
# OPTION 1: Netlify API Proxy (Zero-CORS, Permanent Backend Routing)
# Uncomment the block below and replace YOUR-BACKEND.onrender.com with your live
# permanent backend URL (e.g. from Render: https://your-app.onrender.com).
# This forwards /api/* calls automatically without CORS issues!
# ---------------------------------------------------------------------------------
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND.onrender.com/api/:splat"
#   status = 200
#   force = true

# ---------------------------------------------------------------------------------
# SPA Single-Page-App Fallback
# Required for client-side routing.
# ---------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
