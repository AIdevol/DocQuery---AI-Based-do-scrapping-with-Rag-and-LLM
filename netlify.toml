[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Permanent Backend API Proxy (Zero-CORS)
[[redirects]]
  from = "/api/*"
  to = "https://crinkliest-mirna-loftier.ngrok-free.dev/api/:splat"
  status = 200
  force = true

# SPA Single-Page-App Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
